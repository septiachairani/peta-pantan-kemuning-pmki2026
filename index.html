<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">

        <link rel="stylesheet" href="css/fontawesome-all.min.css">

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        /* ===== Popup rapi ===== */
        .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0,0,0,.28);
        }
        .leaflet-popup-content {
            margin: 0 !important;
            font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222;
        }
        .leaflet-popup-close-button {
            color: #fff !important;
            top: 6px !important;
            right: 6px !important;
        }
        .pp-card {
            width: 330px;
            max-width: calc(100vw - 70px);
            box-sizing: border-box;
        }
        .pp-head {
            background: #1f4e79;
            color: #fff;
            padding: 10px 32px 10px 14px;
        }
        .pp-title { font-size: 14.5px; font-weight: 600; }
        .pp-sub   { font-size: 12px; opacity: .85; margin-top: 1px; }
        .pp-scroll {
            max-height: min(55vh, 360px);
            overflow-y: auto;
            padding: 4px 12px 10px;
        }
        .pp-photo { display: block; background: #eee; }
        .pp-photo img {
            display: block;
            width: 100%;
            max-height: 190px;
            object-fit: cover;
        }
        .pp-sec { border-bottom: 1px solid #e6e6e6; padding: 2px 0; }
        .pp-sec:last-child { border-bottom: 0; }
        .pp-sec > summary {
            cursor: pointer;
            list-style: none;
            padding: 7px 0 5px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: #1f4e79;
        }
        .pp-sec > summary::-webkit-details-marker { display: none; }
        .pp-sec > summary::before {
            content: "\25B8";
            display: inline-block;
            width: 14px;
            transition: transform .15s;
        }
        .pp-sec[open] > summary::before { transform: rotate(90deg); }
        .pp-row {
            display: flex;
            gap: 10px;
            padding: 3px 0;
            border-bottom: 1px dotted #ddd;
        }
        .pp-row:last-child { border-bottom: 0; }
        .pp-k { flex: 0 0 40%; color: #666; }
        .pp-v { flex: 1; font-weight: 500; word-break: break-word; white-space: pre-line; }
        .pp-foot { padding-top: 6px; font-size: 12px; }
        .pp-foot a { color: #1f4e79; }

        /* ===== Legenda ===== */
        .legenda {
            background: rgba(255,255,255,.95);
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.3);
            font: 12.5px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222;
            padding: 6px 10px 8px;
            min-width: 150px;
            max-width: 200px;
        }
        .legenda summary {
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            padding: 2px 0 4px;
            color: #1f4e79;
        }
        .legenda-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
        .legenda-sw {
            flex: 0 0 18px;
            height: 14px;
            border: 1px solid #232323;
            box-sizing: border-box;
        }
        .legenda-sw.titik { border-radius: 50%; width: 16px; height: 16px; flex-basis: 16px; margin: 0 1px; }
        .legenda-sw.garis { border: 0; height: 4px; border-radius: 1px; }
        </style>
        <title>Peta Pantan Kemuning PMKI 2026</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/penutupanlahan_1.js"></script>
        <script src="data/rumah_2.js"></script>
        <script src="data/kebun_3.js"></script>
        <script src="data/Hutan_4.js"></script>
        <script src="data/Peta_Rumah_KKrumah_kk_5.js"></script>
        <script src="data/rumah1_6.js"></script>
        <script src="data/jalan_7.js"></script>
        <script src="data/longsorr_8.js"></script>
        <script src="data/Lines_9.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[4.765656938048143,96.68981148609718],[4.797560145199189,96.7422733542838]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        // =====================================================
        //  PENGATURAN POPUP
        // =====================================================
        // true = NIK ditampilkan sebagian saja (3201************12)
        var SEMBUNYIKAN_NIK = false;

        var POPUP_OPTIONS = {
            minWidth: 200,
            maxWidth: 400,
            autoPanPadding: [20, 20]
        };

        // =====================================================
        //  FUNGSI BANTU POPUP
        // =====================================================
        function esc(v) {
            return String(v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // nilai dianggap ada jika bukan null/kosong/"NULL"
        function has(v) {
            if (v === null || v === undefined) return false;
            var s = String(v).trim();
            return s !== '' && s.toUpperCase() !== 'NULL';
        }

        function fmtNum(v) {
            var n = Number(String(v).replace(',', '.'));
            return isNaN(n) ? String(v) : n.toLocaleString('id-ID');
        }

        function row(label, v) {
            if (!has(v)) return '';
            return '<div class="pp-row"><span class="pp-k">' + esc(label) +
                   '</span><span class="pp-v">' + autolinker.link(esc(v)) + '</span></div>';
        }

        // defs: [[field, label], ...]; numeric = format angka; hideZero = sembunyikan nilai 0
        function rows(p, defs, numeric, hideZero) {
            return defs.map(function (d) {
                var v = p[d[0]];
                if (!has(v)) return '';
                if (hideZero && Number(v) === 0) return '';
                return row(d[1], numeric ? fmtNum(v) : v);
            }).join('');
        }

        function section(title, body, open) {
            if (!body) return '';
            return '<details class="pp-sec"' + (open ? ' open' : '') + '><summary>' +
                   esc(title) + '</summary>' + body + '</details>';
        }

        function card(title, subtitle, body, photoHtml) {
            return '<div class="pp-card"><div class="pp-head"><div class="pp-title">' + esc(title) + '</div>' +
                   (subtitle ? '<div class="pp-sub">' + esc(subtitle) + '</div>' : '') + '</div>' +
                   (photoHtml || '') +
                   '<div class="pp-scroll">' + body + '</div></div>';
        }

        function maskNik(v) {
            var s = String(v);
            return s.length > 6 ? s.slice(0, 4) + '*'.repeat(s.length - 6) + s.slice(-2) : s;
        }

        // popup sederhana untuk layer yang hanya punya kolom "id"
        function simplePopup(label) {
            return function (feature, layer) {
                var id = feature.properties['id'];
                var body = '<div class="pp-sec">' + (row('ID', id) || row('Keterangan', 'Tidak ada atribut')) + '</div>';
                layer.bindPopup(card(label, has(id) ? 'ID ' + id : '', body), POPUP_OPTIONS);
            };
        }

        var pop_rumah_2 = simplePopup('Rumah');
        var pop_kebun_3 = simplePopup('Kebun');
        var pop_Hutan_4 = simplePopup('Hutan');
        var pop_rumah1_6 = simplePopup('Rumah');
        var pop_jalan_7 = simplePopup('Jalan');
        var pop_longsorr_8 = simplePopup('Area Longsor');

        // =====================================================
        //  POPUP: PENUTUPAN LAHAN (data administrasi)
        // =====================================================
        function pop_penutupanlahan_1(feature, layer) {
            var p = feature.properties;
            var body = section('Wilayah administrasi',
                rows(p, [
                    ['NAME_0', 'Negara'],
                    ['NAME_1', 'Provinsi'],
                    ['NAME_2', 'Kabupaten/Kota'],
                    ['NAME_3', 'Kecamatan'],
                    ['NAME_4', 'Desa'],
                    ['VARNAME_4', 'Nama lain'],
                    ['ENGTYPE_4', 'Tipe']
                ]), true) +
                section('Kode',
                rows(p, [
                    ['GID_0', 'GID 0'], ['GID_1', 'GID 1'], ['GID_2', 'GID 2'],
                    ['GID_3', 'GID 3'], ['GID_4', 'GID 4'], ['CC_4', 'CC 4']
                ]), false);
            layer.bindPopup(card('Penutupan Lahan', p['NAME_4'] || '', body), POPUP_OPTIONS);
        }

        // =====================================================
        //  POPUP: RUMAH & KEPALA KELUARGA
        // =====================================================
        function pop_Peta_Rumah_KKrumah_kk_5(feature, layer) {
            var p = feature.properties;

            var nik = has(p['NIK_KK']) ? (SEMBUNYIKAN_NIK ? maskNik(p['NIK_KK']) : p['NIK_KK']) : null;
            var ttl = [p['Tempat_Lahir'], p['Tgl_Lahir']].filter(has).join(', ');
            var koordinat = (has(p['Latitude']) && has(p['Longitude']))
                ? p['Latitude'] + ', ' + p['Longitude'] : null;

            var photoHtml = '';
            if (has(p['fotorumah'])) {
                var src = 'images/' + String(p['fotorumah']).replace(/[\\/:]/g, '_').trim();
                photoHtml = '<a class="pp-photo" href="' + esc(src) + '" target="_blank" rel="noopener">' +
                            '<img src="' + esc(src) + '" alt="Foto rumah" loading="lazy" ' +
                            'onerror="this.parentNode.style.display=\'none\'"></a>';
            }

            var body =
                section('Kepala keluarga',
                    row('Nama', p['Nama_Kepala_Keluarga']) +
                    row('NIK', nik) +
                    row('Tempat, tgl lahir', ttl) +
                    row('Jenis kelamin', p['JK']) +
                    row('Status dalam keluarga', p['SHDK']) +
                    row('Agama', p['Agama']) +
                    row('Pendidikan', p['Pendidikan']) +
                    row('Pekerjaan', p['Pekerjaan']) +
                    row('Ayah', p['Ayah']) +
                    row('Ibu', p['Ibu']), true) +
                section('Keluarga',
                    row('No. KK', p['No_KK']) +
                    row('Jumlah KK', p['Jumlah_KK']) +
                    row('Keterangan KK', p['Keterangan_KK']) +
                    row('Jumlah anggota', p['Jumlah_Anggota']) +
                    row('Anggota keluarga', p['Anggota_Keluarga']), true) +
                section('Bangunan',
                    row('Jenis bangunan', p['Jenis_Bangunan']) +
                    row('Kondisi', p['Kondisi']) +
                    row('Koordinat', koordinat), true) +
                section('Data survei',
                    row('No. objek', p['No_Objek']) +
                    row('Kode KML', p['Kode_KML']) +
                    row('Kode foto', p['Kode_Foto']) +
                    row('Tanggal ambil', p['Tanggal_Ambil']) +
                    row('Foto asli', p['IMG_Asli']), false);

            if (koordinat) {
                body += '<div class="pp-foot"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' +
                        encodeURIComponent(p['Latitude'] + ',' + p['Longitude']) +
                        '">Buka di Google Maps</a></div>';
            }

            var title = has(p['Nama_Kepala_Keluarga']) ? p['Nama_Kepala_Keluarga']
                      : (has(p['Jenis_Bangunan']) ? p['Jenis_Bangunan'] : 'Rumah');
            var sub = has(p['No_Objek']) ? 'Objek No. ' + p['No_Objek'] : '';

            layer.bindPopup(card(title, sub, body, photoHtml), POPUP_OPTIONS);
        }

        // =====================================================
        //  POPUP: BATAS DESA (data kependudukan)
        // =====================================================
        var DEF_USIA = [
            ['U0', '0–4 th'], ['U5', '5–9 th'], ['U10', '10–14 th'], ['U15', '15–19 th'],
            ['U20', '20–24 th'], ['U25', '25–29 th'], ['U30', '30–34 th'], ['U35', '35–39 th'],
            ['U40', '40–44 th'], ['U45', '45–49 th'], ['U50', '50–54 th'], ['U55', '55–59 th'],
            ['U60', '60–64 th'], ['U65', '65–69 th'], ['U70', '70–74 th'], ['U75', '75+ th']
        ];
        var DEF_AGAMA = [
            ['SILAM', 'Islam'], ['KRISTEN', 'Kristen'], ['KHATOLIK', 'Katolik'], ['HINDU', 'Hindu'],
            ['BUDHA', 'Buddha'], ['KONGHUCU', 'Konghucu'], ['KEPERCAYAA', 'Kepercayaan']
        ];
        var DEF_KAWIN = [
            ['BELUM_KAWI', 'Belum kawin'], ['KAWIN', 'Kawin'],
            ['CERAI_HIDU', 'Cerai hidup'], ['CERAI_MATI', 'Cerai mati']
        ];
        var DEF_PENDIDIKAN = [
            ['TIDAK_BELU', 'Tidak/belum sekolah'], ['BELUM_TAMA', 'Belum tamat SD'],
            ['TAMAT_SD', 'Tamat SD'], ['SLTP', 'SLTP'], ['SLTA', 'SLTA'],
            ['DIPLOMA_I', 'Diploma I'], ['DIPLOMA_II', 'Diploma II'], ['DIPLOMA_IV', 'Diploma IV'],
            ['STRATA_II', 'Strata II'], ['STRATA_III', 'Strata III']
        ];
        var DEF_PEKERJAAN = [
            ['BELUM_TIDA', 'Belum/tidak bekerja'], ['APARATUR_P', 'Aparatur pemerintah'],
            ['TENAGA_PEN', 'Tenaga pengajar'], ['WIRASWASTA', 'Wiraswasta'], ['PERTANIAN', 'Pertanian'],
            ['NELAYAN', 'Nelayan'], ['AGAMA_DAN', 'Agama dan kepercayaan'],
            ['PELAJAR_MA', 'Pelajar/mahasiswa'], ['TENAGA_KES', 'Tenaga kesehatan'],
            ['PENSIUNAN', 'Pensiunan'], ['LAINNYA', 'Lainnya']
        ];
        var DEF_PEKERJAAN_RINCI = [
            ['MENGUR_', 'Mengurus rumah tangga'], ['PELAJAR_', 'Pelajar/mahasiswa'],
            ['PENSIUNA_1', 'Pensiunan'], ['PEGAWAI_', 'Pegawai'], ['TENTARA', 'Tentara'],
            ['KEPOLISIAN', 'Kepolisian'], ['PERDAG_', 'Perdagangan'], ['PETANI', 'Petani'],
            ['PETERN_', 'Peternak'], ['NELAYAN_1', 'Nelayan'], ['INDUSTR_', 'Industri'],
            ['KONSTR_', 'Konstruksi'], ['TRANSP_', 'Transportasi'], ['KARYAW_', 'Karyawan'],
            ['BURUH', 'Buruh'], ['PEMBANT_', 'Pembantu rumah tangga'], ['TUKANG', 'Tukang'],
            ['PENATA', 'Penata'], ['MEKANIK', 'Mekanik'], ['SENIMAN_', 'Seniman'], ['TABIB', 'Tabib'],
            ['PARAJI_', 'Paraji'], ['PERANCA_', 'Perancang'], ['PENTER_', 'Penerjemah'],
            ['IMAM_M', 'Imam masjid'], ['PENDETA', 'Pendeta'], ['PASTOR', 'Pastor'],
            ['WARTAWAN', 'Wartawan'], ['USTADZ', 'Ustadz'], ['JURU_M', 'Juru masak'],
            ['PROMOT', 'Promotor'], ['ANGGOTA_', 'Anggota lembaga'], ['PRESIDEN', 'Presiden'],
            ['WAKIL_PRES', 'Wakil presiden'], ['DUTA_B', 'Duta besar'], ['GUBERNUR', 'Gubernur'],
            ['WAKIL_GUBE', 'Wakil gubernur'], ['BUPATI', 'Bupati'], ['WAKIL_BUPA', 'Wakil bupati'],
            ['WALIKOTA', 'Walikota'], ['WAKIL_WALI', 'Wakil walikota'], ['DOSEN', 'Dosen'],
            ['GURU', 'Guru'], ['PILOT', 'Pilot'], ['PENGACARA_', 'Pengacara'], ['NOTARIS', 'Notaris'],
            ['ARSITEK', 'Arsitek'], ['AKUNTA_', 'Akuntan'], ['KONSUL_', 'Konsultan'],
            ['DOKTER', 'Dokter'], ['BIDAN', 'Bidan'], ['PERAWAT', 'Perawat'], ['APOTEK_', 'Apoteker'],
            ['PSIKIATER', 'Psikiater'], ['PENYIA_', 'Penyiar'], ['PELAUT', 'Pelaut'],
            ['PENELITI', 'Peneliti'], ['SOPIR', 'Sopir'], ['PIALAN', 'Pialang'],
            ['PARANORMAL', 'Paranormal'], ['PEDAGA_', 'Pedagang'], ['PERANG_', 'Perangkat desa'],
            ['KEPALA_', 'Kepala desa'], ['BIARAW_', 'Biarawan/biarawati'],
            ['WIRASWAST_', 'Wiraswasta'], ['LAINNYA_12', 'Lainnya']
        ];

        function pop_Lines_9(feature, layer) {
            var p = feature.properties;
            var namaDesa = has(p['DESA_KELUR']) ? p['DESA_KELUR'] : p['DESA'];

            var body =
                section('Wilayah',
                    row('Desa/Kelurahan', namaDesa) +
                    row('Kecamatan', p['KECAMATAN']) +
                    row('Kabupaten/Kota', p['KAB_KOTA']) +
                    row('Provinsi', p['PROVINSI']) +
                    row('Kode desa', p['KODE_DESA']) +
                    (has(p['LUAS_WILAY']) ? row('Luas wilayah', fmtNum(p['LUAS_WILAY'])) : '') +
                    (has(p['LUAS_DESA']) ? row('Luas desa', fmtNum(p['LUAS_DESA'])) : '') +
                    (has(p['KEPADATAN']) ? row('Kepadatan', fmtNum(p['KEPADATAN'])) : ''), true) +
                section('Penduduk',
                    rows(p, [
                        ['JUMLAH_PEN', 'Jumlah penduduk'], ['JUMLAH_KK', 'Jumlah KK'],
                        ['PRIA', 'Laki-laki'], ['WANITA', 'Perempuan'],
                        ['PERPINDAHA', 'Perpindahan'], ['PERUBAHAN', 'Perubahan'],
                        ['WAJIB_KTP', 'Wajib KTP']
                    ], true), true) +
                section('Agama', rows(p, DEF_AGAMA, true, true), false) +
                section('Status perkawinan', rows(p, DEF_KAWIN, true), false) +
                section('Kelompok usia', rows(p, DEF_USIA, true), false) +
                section('Pendidikan', rows(p, DEF_PENDIDIKAN, true), false) +
                section('Pekerjaan', rows(p, DEF_PEKERJAAN, true), false) +
                section('Pekerjaan (rinci)', rows(p, DEF_PEKERJAAN_RINCI, true, true), false);

            layer.bindPopup(card(has(namaDesa) ? 'Desa ' + namaDesa : 'Batas Desa',
                                 has(p['KECAMATAN']) ? 'Kec. ' + p['KECAMATAN'] : '', body), POPUP_OPTIONS);
        }

        // =====================================================
        //  LAYER PETA
        // =====================================================
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);

        function style_penutupanlahan_1_0() {
            return {
                pane: 'pane_penutupanlahan_1',
                opacity: 1,
                color: 'rgba(128,62,0,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(201,167,124,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_penutupanlahan_1');
        map.getPane('pane_penutupanlahan_1').style.zIndex = 401;
        map.getPane('pane_penutupanlahan_1').style['mix-blend-mode'] = 'normal';
        var layer_penutupanlahan_1 = new L.geoJson(json_penutupanlahan_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_penutupanlahan_1',
            layerName: 'layer_penutupanlahan_1',
            pane: 'pane_penutupanlahan_1',
            onEachFeature: pop_penutupanlahan_1,
            style: style_penutupanlahan_1_0,
        });
        bounds_group.addLayer(layer_penutupanlahan_1);
        map.addLayer(layer_penutupanlahan_1);

        function style_rumah_2_0() {
            return {
                pane: 'pane_rumah_2',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(196,60,57,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_rumah_2');
        map.getPane('pane_rumah_2').style.zIndex = 402;
        map.getPane('pane_rumah_2').style['mix-blend-mode'] = 'normal';
        var layer_rumah_2 = new L.geoJson(json_rumah_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_rumah_2',
            layerName: 'layer_rumah_2',
            pane: 'pane_rumah_2',
            onEachFeature: pop_rumah_2,
            style: style_rumah_2_0,
        });
        bounds_group.addLayer(layer_rumah_2);
        map.addLayer(layer_rumah_2);

        function style_kebun_3_0() {
            return {
                pane: 'pane_kebun_3',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(168,216,120,1.0)',
                interactive: true,
            }
        }
